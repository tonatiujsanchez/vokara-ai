# Local mirror of the blocking CI steps: what fails here fails in CI too.
# Install once with `uvx pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: mixed-line-ending
        # LF everywhere, on every machine (ADR-000: WSL2 + macOS).
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      # mypy runs inside the backend environment: the mirrors-mypy hook builds
      # its own env without our dependencies and reports errors that do not
      # exist.
      - id: mypy
        name: mypy --strict (backend)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
