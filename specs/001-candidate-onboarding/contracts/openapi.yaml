openapi: 3.1.0

# Contrato HTTP de diseño de la feature 001-candidate-onboarding.
# El OpenAPI de producción lo genera FastAPI desde los modelos Pydantic; este
# archivo es la fuente de diseño que la implementación debe satisfacer.
# El cliente TypeScript se genera del OpenAPI de FastAPI (art. I): PROHIBIDO
# escribir tipos de API a mano en el frontend.

info:
  title: Vokara API — Onboarding del candidato
  version: "0.2.0"
  description: |
    Endpoints de la feature 001. Todos los mensajes de error viajan en español
    (art. IX) acompañados de un `code` estable en inglés que el frontend usa
    para decidir comportamiento, nunca para construir el texto.

    SIN AUTENTICACIÓN (ADR-008). No hay registro, login, sesiones ni tokens: la
    instancia sirve a una sola persona, la que la instaló, y escucha únicamente
    en la interfaz local. El `candidate_id` lo resuelve SIEMPRE la capa de API
    desde la configuración local; ningún endpoint lo acepta como parámetro, ni
    en ruta, ni en query, ni en cuerpo, ni en cabecera (FR-003, FR-049).

    NINGUNA RESPUESTA EXPONE UNA CREDENCIAL, ni completa ni parcialmente. El
    estado consultable de una credencial es exactamente
    `configured | not_configured | rejected` (FR-008, FR-013, SC-013).

    EL FRONTEND NO RAMIFICA POR PROVEEDOR (art. XI): recibe el catálogo de
    opciones ofrecibles y los mensajes ya resueltos, y los renderiza.

servers:
  - url: /api/v1

tags:
  - name: setup
    description: Primera ejecución — divulgación, proveedores con preflight y correo (FR-001 – FR-015).
  - name: documents
    description: Subida y consulta del CV maestro (FR-016 – FR-018).
  - name: parse-jobs
    description: Estado y reintento del procesamiento (FR-019, FR-023).
  - name: profile
    description: Perfil maestro, objetivos y confirmación (FR-029, FR-035 – FR-044).
  - name: profile-entries
    description: Entradas atómicas del perfil (FR-024 – FR-028, FR-030 – FR-033).
  - name: profile-versions
    description: Historial inmutable de versiones (FR-040, FR-041).

paths:
  # ───────────────────────── primera ejecución (wizard) ─────────────────────
  /setup/state:
    get:
      tags: [setup]
      summary: Estado de la primera ejecución y paso pendiente (FR-014, FR-015)
      description: |
        Punto de entrada de la SPA. `pending_step` se DERIVA de los hechos
        registrados —acuse, preflight de cada capacidad, estado del paso de
        correo—, nunca de un puntero persistido (research R-18). Al reabrir la
        aplicación se retoma exactamente en el paso pendiente, sin volver a
        pedir el acuse ni las credenciales ya verificadas.

        Si una credencial cambió fuera de la aplicación, su preflight queda
        invalidado y `pending_step` vuelve a `providers` SOLO para esa
        capacidad (research R-24, SC-012).
      responses:
        '200':
          description: Estado del wizard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupState' }

  /setup/disclosure:
    get:
      tags: [setup]
      summary: Texto vigente de la divulgación y estado de su acuse (FR-001)
      description: |
        Devuelve el texto COMPLETO para mostrarlo en pantalla. El art. V
        prohíbe que la divulgación sea solo un enlace o solo el README.
      responses:
        '200':
          description: Divulgación vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disclosure' }

  /setup/disclosure-acknowledgement:
    post:
      tags: [setup]
      summary: Registra el acuse explícito de la divulgación (FR-002)
      description: |
        Acuse afirmativo y explícito: NUNCA preseleccionado, NUNCA inferido de
        continuar. Se registra con marca de tiempo y con la versión del texto
        efectivamente acusado. Sin él, ningún endpoint del onboarding responde
        (gate de servidor, SC-011).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disclosure_version, acknowledged]
              properties:
                disclosure_version: { type: string, examples: ["2026-08-11"] }
                acknowledged: { type: boolean, const: true }
      responses:
        '201':
          description: Acuse registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupState' }
        '409':
          description: Ya existe acuse para esa versión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /setup/providers/catalog:
    get:
      tags: [setup]
      summary: Proveedores ofrecibles por capacidad, con su costo estimado (FR-004, FR-005, FR-009)
      description: |
        Lista CERRADA. Solo aparecen los proveedores cuya verificación empírica
        está registrada (FR-009); un proveedor sin verificar no se ofrece. No
        existe forma de configurar un endpoint arbitrario en v1.

        El costo estimado por mes de búsqueda activa viaja aquí para que el
        frontend pueda mostrarlo ANTES de pedir ninguna API key (FR-005), con
        el supuesto de uso a la vista y estimado por separado para generación
        y para embeddings.
      responses:
        '200':
          description: Catálogo por capacidad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCatalog' }

  /setup/providers/{capability}:
    parameters:
      - { name: capability, in: path, required: true, schema: { $ref: '#/components/schemas/Capability' } }
    get:
      tags: [setup]
      summary: Configuración vigente de una capacidad
      responses:
        '200':
          description: Configuración, o `null` si no hay ninguna
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ProviderConfiguration' }
                  - { type: 'null' }
    put:
      tags: [setup]
      summary: Configura una capacidad y ejecuta su preflight (FR-004, FR-006, FR-007)
      description: |
        Generación y embeddings se configuran de forma INDEPENDIENTE: pueden
        ser el mismo proveedor o dos distintos, y ninguna elección condiciona a
        la otra (ADR-011). Si el usuario elige el mismo proveedor para ambas,
        la llave se pide una sola vez y cada capacidad se verifica por separado.

        El preflight se ejecuta AQUÍ, al guardar, nunca diferido al primer uso
        real (FR-006). La respuesta 200 lleva SIEMPRE un `preflight` con una de
        las cuatro variantes de FR-007, incluidas las que no permiten avanzar:
        no son errores de transporte, son resultados de la verificación.

        La API key viaja en el cuerpo, se usa para el preflight y se escribe en
        la CONFIGURACIÓN LOCAL. NUNCA se persiste en la base de datos y NUNCA
        vuelve en ninguna respuesta (FR-008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, api_key]
              properties:
                provider:
                  type: string
                  description: Identificador del catálogo cerrado. Debe tener verificación registrada (FR-009).
                api_key:
                  type: string
                  format: password
                  description: Credencial del usuario. Write-only; jamás se devuelve.
                model:
                  type: [string, 'null']
                  description: |
                    Opcional. Si se omite, se usa el modelo por defecto de la
                    configuración. Los nombres de modelo NUNCA viven en
                    constantes de código (ADR-011).
      responses:
        '200':
          description: |
            Preflight ejecutado. Ver `preflight.result` para saber si la
            capacidad quedó disponible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderConfiguration' }
        '400':
          description: |
            `code` ∈ {PROVIDER_CREDENTIAL_REJECTED, MODEL_NOT_AVAILABLE}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            `code` = PROVIDER_NOT_OFFERED — proveedor sin verificación
            registrada o fuera de la lista cerrada (FR-009).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            `code` = PROVIDER_QUOTA_EXCEEDED. La credencial SIRVE, la cuota no
            (FR-007.4). Nunca se presenta como credencial inválida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: |
            `code` = PROVIDER_UNREACHABLE — no se pudo verificar. Se distingue
            explícitamente de una llave inválida y permite reintentar sin
            volver a escribirla.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /setup/providers/{capability}/degradation-acknowledgement:
    post:
      tags: [setup]
      summary: Acuse específico de una degradación explícita (FR-007.3, SC-016)
      description: |
        Solo aplica cuando el preflight resultó `capability_unverified`. El
        sistema ya enumeró qué funciones concretas quedan afectadas y por qué,
        y ofreció cambiar de proveedor; este acuse es lo único que permite
        continuar así. PROHIBIDA la degradación silenciosa.
      parameters:
        - { name: capability, in: path, required: true, schema: { $ref: '#/components/schemas/Capability' } }
      responses:
        '201':
          description: Acuse registrado; la capacidad queda utilizable con la degradación declarada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderConfiguration' }
        '409':
          description: El preflight vigente no es `capability_unverified`; no hay degradación que acusar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /setup/email:
    get:
      tags: [setup]
      summary: Estado del paso de correo y su divulgación previa (FR-011, FR-012)
      description: |
        Incluye el texto de la divulgación obligatoria que debe mostrarse ANTES
        de pedir credencial alguna: que una App Password da acceso a TODA la
        bandeja y que leer solo la etiqueta designada es un compromiso de
        Vokara verificado por sus propias pruebas, no un límite que Google
        imponga; y que las cuentas de Workspace y de Protección Avanzada no
        admiten App Passwords, con el enlace a la vía OAuth.
      responses:
        '200':
          description: Estado del paso de correo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailStep' }

  /setup/email/link:
    post:
      tags: [setup]
      summary: Vincula la cuenta de correo y verifica la etiqueta designada (FR-013)
      description: |
        Verifica que la etiqueta EXISTE y es alcanzable antes de dar la
        vinculación por establecida. La App Password se escribe en la
        configuración local con las mismas reglas que las API keys: nunca en la
        base de datos, nunca en logs ni en mensajes de error (FR-008, FR-013).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email_address, app_password, label]
              properties:
                email_address: { type: string, format: email }
                app_password: { type: string, format: password, description: Write-only; jamás se devuelve. }
                label: { type: string, description: Etiqueta de Gmail a la que Vokara restringe cada consulta. }
      responses:
        '200':
          description: Vinculación establecida y etiqueta verificada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailStep' }
        '400':
          description: |
            `code` = EMAIL_APP_PASSWORD_REJECTED. El paso sigue siendo omitible
            sin consecuencias.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            `code` = EMAIL_LABEL_NOT_FOUND — la etiqueta no existe o no es
            alcanzable. La vinculación NO se da por buena.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: '`code` = EMAIL_PROVIDER_UNREACHABLE'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /setup/email/skip:
    post:
      tags: [setup]
      summary: Omite el paso de correo (FR-011)
      description: |
        Paso opcional y visiblemente opcional: omitible con una sola acción y
        con el mismo peso visual que continuar. Omitirlo NUNCA bloquea el
        onboarding ni deshabilita ninguna funcionalidad de esta feature.
      responses:
        '200':
          description: Paso omitido; la primera ejecución puede concluir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupState' }

  # ─────────────────────────────── documentos ───────────────────────────────
  /documents:
    post:
      tags: [documents]
      summary: Sube el CV maestro y encola su procesamiento (FR-016 – FR-019)
      description: |
        Validación síncrona antes de encolar: tamaño ≤ 10 MB, tipo real por
        firma de bytes (no por extensión) y legibilidad del archivo. Un rechazo
        aquí NO crea documento ni entradas (SC-008).

        Gates de la primera ejecución, evaluados ANTES que la validación del
        archivo y aplicados en el SERVIDOR (no solo en el guard de la SPA):
        acuse de divulgación registrado (FR-002, SC-011) y proveedor de
        GENERACIÓN con preflight resuelto (FR-010). La ausencia de proveedor de
        embeddings NUNCA bloquea esta operación.

        Requiere además que no exista otro procesamiento activo.

        El archivo se conserva como respaldo en el directorio de datos local,
        SIN cifrado en reposo (FR-018, ADR-007). Su `storage_key` nunca se
        expone en ninguna respuesta.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF o DOCX, máximo 10 MB
      responses:
        '202':
          description: Archivo aceptado y procesamiento encolado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadAccepted' }
        '400':
          description: |
            Archivo rechazado antes de procesar. `code` ∈ {FILE_TOO_LARGE,
            UNSUPPORTED_FILE_TYPE, DOCUMENT_CORRUPT}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `code` ∈ {DISCLOSURE_ACKNOWLEDGEMENT_REQUIRED,
            GENERATION_PROVIDER_REQUIRED, PARSE_JOB_ALREADY_ACTIVE,
            PROFILE_ALREADY_SEEDED}. El último se reserva para la feature 007.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /documents/{document_id}:
    get:
      tags: [documents]
      summary: Metadatos del documento y su procesamiento
      parameters:
        - { name: document_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Documento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────── parse jobs ───────────────────────────────
  /parse-jobs/current:
    get:
      tags: [parse-jobs]
      summary: Trabajo de procesamiento más reciente del candidato
      description: |
        Punto de entrada del polling del frontend al volver a la aplicación
        (edge case "cierre del navegador durante el procesamiento").
      responses:
        '200':
          description: Trabajo más reciente, o `null` si nunca hubo uno
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ParseJob' }
                  - { type: 'null' }

  /parse-jobs/{job_id}:
    get:
      tags: [parse-jobs]
      summary: Estado del procesamiento (FR-019)
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Estado del trabajo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParseJob' }
        '404': { $ref: '#/components/responses/NotFound' }

  /parse-jobs/{job_id}/retry:
    post:
      tags: [parse-jobs]
      summary: Reintenta un procesamiento fallido (FR-023)
      description: |
        Solo se acepta sobre un trabajo en estado `failed`. Crea un trabajo
        nuevo sobre el mismo documento; la siembra es aditiva y nunca borra
        entradas creadas o editadas por el candidato.
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: Reintento encolado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParseJob' }
        '409':
          description: |
            `code` ∈ {PARSE_JOB_NOT_RETRYABLE, PARSE_JOB_ALREADY_ACTIVE}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────── perfil ───────────────────────────────────
  /profile:
    get:
      tags: [profile]
      summary: Perfil maestro del candidato autenticado
      description: |
        Devuelve el trabajo en curso más el estado derivado: paso del onboarding
        (research R-18, US3 AC5), bloqueadores de confirmación (FR-039) y si hay
        cambios sin confirmar (FR-044). El perfil se crea de forma perezosa: si
        no existe, se devuelve uno vacío en estado `draft`.
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }

  /profile/objectives:
    patch:
      tags: [profile]
      summary: Actualiza el cuestionario de objetivos (FR-035 – FR-037)
      description: |
        Actualización parcial. `salary_min` no puede superar a `salary_max` y la
        moneda es obligatoria si hay cualquier valor salarial (FR-036); el error
        se explica en español.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectivesPatch' }
      responses:
        '200':
          description: Objetivos actualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /profile/confirm:
    post:
      tags: [profile]
      summary: Confirmación explícita del candidato (FR-038 – FR-040, art. X)
      description: |
        ÚNICO camino por el que un perfil llega a `complete`. Crea una versión
        inmutable con el contenido íntegro (entradas vivas + objetivos) y la
        deja como versión vigente. Sobre un perfil ya `complete`, confirma los
        cambios pendientes creando una versión nueva (FR-044) sin cambiar el
        estado.
      responses:
        '201':
          description: Versión creada y perfil confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileVersion' }
        '409':
          description: |
            `code` = NO_PENDING_CHANGES — el perfil está confirmado y no hay
            nada que confirmar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            `code` = CONFIRMATION_BLOCKED. `details.blockers` enumera exactamente
            qué falta (FR-039).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /profile/pending-changes:
    get:
      tags: [profile]
      summary: Detalle de los cambios sin confirmar (FR-044)
      description: |
        Diff determinista entre el trabajo en curso y la versión vigente. Si no
        hay versión vigente, `has_changes` es falso y las listas van vacías: todo
        el perfil es trabajo en curso todavía sin confirmar.
      responses:
        '200':
          description: Diff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingChanges' }

  # ─────────────────────────── entradas del perfil ──────────────────────────
  /profile/entries:
    get:
      tags: [profile-entries]
      summary: Lista las entradas vivas del perfil (FR-030)
      parameters:
        - name: entry_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EntryType' }
      responses:
        '200':
          description: Entradas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProfileEntry' }
    post:
      tags: [profile-entries]
      summary: Crea una entrada nueva (FR-033, FR-022)
      description: Se registra siempre con origen `user_added`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryCreate' }
      responses:
        '201':
          description: Entrada creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileEntry' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /profile/entries/{entry_id}:
    get:
      tags: [profile-entries]
      summary: Detalle de una entrada
      parameters:
        - { name: entry_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Entrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [profile-entries]
      summary: Edita una entrada (FR-031)
      description: |
        El identificador NUNCA cambia (FR-025). Si la entrada tenía origen
        `cv_seed` y el contenido cambia de verdad, pasa a `user_edited`; un
        guardado sin cambios no altera el origen. Las entradas `user_added`
        conservan su origen (ver research.md R-09).
      parameters:
        - { name: entry_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryPatch' }
      responses:
        '200':
          description: Entrada actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [profile-entries]
      summary: Elimina una entrada del perfil (FR-032)
      parameters:
        - { name: entry_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Entrada eliminada; no reaparece en revisiones posteriores }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── versiones del perfil ─────────────────────────
  /profile/versions:
    get:
      tags: [profile-versions]
      summary: Historial de versiones confirmadas (FR-041)
      responses:
        '200':
          description: Versiones, de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProfileVersionSummary' }

  /profile/versions/{version_id}:
    get:
      tags: [profile-versions]
      summary: Contenido íntegro de una versión pasada (FR-041)
      parameters:
        - { name: version_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Versión con su contenido completo e inmutable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileVersion' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  # Sin `securitySchemes`: no hay autenticación (ADR-008). El único control de
  # acceso es dónde escucha la instancia — puertos publicados solo en 127.0.0.1,
  # verificado por tests/integration/test_local_binding.py.

  responses:
    NotFound:
      description: |
        El recurso no existe o no pertenece al `candidate_id` de la instalación.
        Se responde 404 (no 403) para no revelar la existencia de recursos
        ajenos (FR-049).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Cuerpo inválido; mensaje explicativo en español
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Código estable en inglés. Catálogo completo en contracts/errors.md.
            CONJUNTO CERRADO: el frontend ramifica sobre `code` y sobre nada más,
            así que viaja como enum para que el cliente generado no pueda
            ramificar sobre un código que ya no existe (art. I).
            Los códigos de las features 002+ se añaden aquí al implementarlas.
          enum:
            - INTERNAL_ERROR
            - VALIDATION_ERROR
            - DISCLOSURE_ACKNOWLEDGEMENT_REQUIRED
            - DISCLOSURE_ALREADY_ACKNOWLEDGED
            - PROVIDER_CREDENTIAL_REJECTED
            - PROVIDER_QUOTA_EXCEEDED
            - PROVIDER_UNREACHABLE
            - MODEL_NOT_AVAILABLE
            - PROVIDER_NOT_OFFERED
            - DEGRADATION_ACKNOWLEDGEMENT_REQUIRED
            - GENERATION_PROVIDER_REQUIRED
            - EMAIL_APP_PASSWORD_REJECTED
            - EMAIL_LABEL_NOT_FOUND
            - EMAIL_PROVIDER_UNREACHABLE
          examples: ["PROVIDER_QUOTA_EXCEEDED"]
        message:
          type: string
          description: |
            Mensaje accionable en español (art. IX). NUNCA incluye contenido del
            documento ni datos personales (FR-045).
          examples: ["Tu PDF no tiene texto seleccionable..."]
        details:
          type: object
          additionalProperties: true
          description: Información estructurada específica del error (campos inválidos, bloqueadores).

    # ─────────────────── primera ejecución (wizard) ────────────────────
    Capability:
      type: string
      description: |
        Las dos capacidades que se configuran de forma INDEPENDIENTE (ADR-011).
        Ninguna feature consulta el nombre del proveedor: consulta la capacidad.
      enum: [generation, embeddings]

    SetupStep:
      type: string
      description: Paso pendiente del wizard, DERIVADO de los hechos registrados (research R-18).
      enum: [disclosure, providers, email]

    CredentialStatus:
      type: string
      description: |
        Único estado de una credencial que la API expone. NUNCA se devuelve la
        llave, ni siquiera parcialmente (FR-008, FR-013, SC-013).
      enum: [configured, not_configured, rejected]

    PreflightResult:
      type: string
      description: |
        Los CUATRO resultados que FR-007 exige distinguir, más el caso de
        entorno `provider_unreachable`, que no es un resultado de capacidad: se
        comunica como "no se pudo verificar", nunca como credencial inválida.
      enum:
        - verified
        - capability_unverified
        - credential_rejected
        - quota_exceeded
        - provider_unreachable

    AffectedFeature:
      type: object
      description: Función concreta afectada por una degradación (FR-007.3, SC-016).
      required: [code, message]
      properties:
        code: { type: string, enum: [CV_PARSING, SEMANTIC_MATCHING] }
        message: { type: string, description: Explicación en español de qué deja de funcionar y por qué. }

    Disclosure:
      type: object
      description: |
        Texto COMPLETO de la divulgación del art. V, para mostrarse en pantalla
        (FR-001). Nunca solo un enlace, nunca solo el README.
      required: [version, body_md, acknowledged]
      properties:
        version: { type: string, examples: ["2026-08-11"] }
        body_md:
          type: string
          description: |
            Texto en español. Cubre los cuatro puntos obligatorios de FR-001:
            qué se queda en la máquina; la ÚNICA excepción, con qué se envía y
            cuándo; que Vokara no envía nada a sus creadores; y que los archivos
            quedan SIN CIFRAR en el disco (ADR-007), con la recomendación de
            activar el cifrado de disco del sistema operativo.
        acknowledged: { type: boolean }
        acknowledged_at: { type: [string, 'null'], format: date-time }
        acknowledged_version:
          type: [string, 'null']
          description: |
            Versión efectivamente acusada. Guardarla es lo que permite exigir un
            acuse nuevo si el texto cambia, en vez de darlo por cubierto por uno
            viejo que decía otra cosa (research R-29).

    ProviderOption:
      type: object
      description: |
        Opción ofrecible. Solo aparece si su verificación empírica está
        registrada (FR-009). El frontend la renderiza sin conocer proveedores.
      required: [provider, display_name, is_suggested_default, credential_url, estimated_cost]
      properties:
        provider: { type: string, examples: ["google"] }
        display_name: { type: string }
        is_suggested_default:
          type: boolean
          description: Gemini es el default sugerido para ambas capacidades por su capa gratuita (ADR-003).
        credential_url:
          type: string
          format: uri
          description: Dónde obtener la llave, con los pasos contados.
        default_model: { type: string, description: Viene de configuración, nunca de una constante de código. }
        embedding_dim:
          type: [integer, 'null']
          description: Dimensión declarada en la matriz de capacidades; solo para `embeddings`.
        estimated_cost: { $ref: '#/components/schemas/EstimatedCost' }

    EstimatedCost:
      type: object
      description: |
        Costo estimado por mes de búsqueda activa, mostrado ANTES de pedir la
        API key (FR-005) y estimado POR SEPARADO para generación y embeddings:
        sus órdenes de magnitud no se parecen, y sumarlos haría creer que
        cambiar el proveedor de embeddings mueve la factura.
      required: [currency, is_estimated]
      properties:
        amount_usd:
          type: [number, 'null']
          description: |
            `null` mientras el cálculo del paso 10 del roadmap esté pendiente
            (research R-27). La ausencia se dice —ver `pending_note_es`—, NUNCA
            se rellena con una cifra plausible: es la misma regla del art. IV
            aplicada a lo que Vokara dice de sí mismo.
        currency: { type: string, const: USD }
        usage_assumption_es:
          type: [string, 'null']
          description: Supuesto de uso a la vista, para que la cifra sea interpretable y no un número mágico.
        has_free_tier:
          type: [boolean, 'null']
          description: Si el proveedor tiene capa gratuita. Es un hecho del proveedor y se conoce ya.
        free_tier_note_es:
          type: [string, 'null']
          description: Qué cabe en la capa gratuita y a partir de qué punto se empieza a pagar.
        is_estimated:
          type: boolean
          description: Falso mientras no haya cifra publicada para esa opción.
        pending_note_es:
          type: [string, 'null']
          description: Qué mostrar en lugar de la cifra mientras `is_estimated` sea falso.

    ProviderCatalog:
      type: object
      description: Lista CERRADA por capacidad; el usuario elige de un desplegable, no escribe un endpoint (FR-009).
      required: [generation, embeddings]
      properties:
        generation:
          type: array
          items: { $ref: '#/components/schemas/ProviderOption' }
        embeddings:
          type: array
          items: { $ref: '#/components/schemas/ProviderOption' }
        separation_reason_es:
          type: string
          description: |
            Por qué se configuran por separado, en una línea para la pantalla:
            no todos los proveedores ofrecen embeddings, y amarrarlos dejaría el
            matching semántico inoperante según a quién eligiera el usuario.

    PreflightOutcome:
      type: object
      required: [result, checked_at, message]
      properties:
        result: { $ref: '#/components/schemas/PreflightResult' }
        checked_at: { type: string, format: date-time }
        message:
          type: string
          description: |
            Mensaje accionable en español. NUNCA la llave, NUNCA una traza
            técnica (FR-007, SC-013).
        embedding_dim:
          type: [integer, 'null']
          description: Dimensión verificada; presente cuando `result` es `verified` en `embeddings` (FR-007.2).
        affected_features:
          type: array
          description: |
            Funciones concretas afectadas. NO vacío cuando `result` es
            `capability_unverified`: enumerarlas ANTES de permitir continuar es
            lo que distingue la degradación explícita de la silenciosa.
          items: { $ref: '#/components/schemas/AffectedFeature' }

    ProviderConfiguration:
      type: object
      required: [capability, provider, model, credential_status, preflight, is_usable]
      properties:
        capability: { $ref: '#/components/schemas/Capability' }
        provider: { type: string }
        model: { type: string }
        credential_status: { $ref: '#/components/schemas/CredentialStatus' }
        preflight: { $ref: '#/components/schemas/PreflightOutcome' }
        degradation_acknowledged_at:
          type: [string, 'null']
          format: date-time
          description: Acuse específico de la degradación (FR-007.3). Requisito para usar una capacidad `capability_unverified`.
        is_usable:
          type: boolean
          description: |
            Derivado: `verified`, o `capability_unverified` CON acuse. Es lo que
            evalúa el gate del onboarding para la capacidad `generation`
            (FR-010).
        configuration_notice_es:
          type: [string, 'null']
          description: |
            Aviso de configuración, NUNCA una credencial. Se emite cuando la
            misma credencial también está definida en el entorno o en el `.env`:
            gana la que el asistente acaba de guardar, y decirlo es lo que
            impide resolver el conflicto en silencio (art. XI). Añadido al
            implementar T050/T059.

    EmailStep:
      type: object
      required: [status, disclosure_md, is_skippable]
      properties:
        status: { type: string, enum: [pending, linked, skipped] }
        disclosure_md:
          type: string
          description: |
            Divulgación obligatoria PREVIA a pedir credencial (FR-012): que una
            App Password da acceso a TODA la bandeja y que leer solo la etiqueta
            designada es un compromiso de Vokara verificado por sus propias
            pruebas, no un límite que Google imponga; y que las cuentas de
            Workspace y de Protección Avanzada no admiten App Passwords.
        oauth_docs_url: { type: string, format: uri, description: Vía alternativa documentada (ADR-012). }
        label: { type: [string, 'null'], description: Etiqueta designada. Nunca la App Password. }
        linked_at: { type: [string, 'null'], format: date-time }
        credential_status: { $ref: '#/components/schemas/CredentialStatus' }
        is_skippable:
          type: boolean
          const: true
          description: |
            Siempre verdadero (FR-011). Omitir tiene el mismo peso visual que
            continuar y NUNCA bloquea el onboarding.
        value_if_linked_es: { type: string, description: Qué se gana vinculando. }
        value_if_skipped_es: { type: string, description: Qué NO se pierde al omitirlo. }
        configuration_notice_es:
          type: [string, 'null']
          description: |
            Mismo aviso que en `ProviderConfiguration`, para la App Password:
            si también está en el entorno, gana la del asistente y se dice.

    SetupState:
      type: object
      description: |
        Hechos registrados de la primera ejecución. NUNCA contiene credenciales
        (FR-008, FR-013). `pending_step` se deriva de estos hechos.
      required: [disclosure_acknowledged, providers, email_status, is_complete]
      properties:
        pending_step:
          oneOf:
            - { $ref: '#/components/schemas/SetupStep' }
            - { type: 'null' }
          description: '`null` ⇔ la primera ejecución concluyó y no vuelve a mostrarse (FR-015).'
        disclosure_acknowledged: { type: boolean }
        disclosure_acknowledged_at: { type: [string, 'null'], format: date-time }
        providers:
          type: object
          description: Configuración por capacidad; `null` en la que no se haya configurado.
          required: [generation, embeddings]
          properties:
            generation:
              oneOf:
                - { $ref: '#/components/schemas/ProviderConfiguration' }
                - { type: 'null' }
            embeddings:
              oneOf:
                - { $ref: '#/components/schemas/ProviderConfiguration' }
                - { type: 'null' }
        email_status: { type: string, enum: [pending, linked, skipped] }
        is_complete:
          type: boolean
          description: |
            Derivado (FR-015): acuse registrado, generación utilizable y paso de
            correo completado u omitido.

    # ─────────────────────────── onboarding del CV ─────────────────────────
    UploadAccepted:
      type: object
      required: [document_id, parse_job]
      properties:
        document_id: { type: string, format: uuid }
        parse_job: { $ref: '#/components/schemas/ParseJob' }

    Document:
      type: object
      required: [id, kind, original_filename, size_bytes, uploaded_at, availability]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [pdf, docx] }
        original_filename: { type: string }
        size_bytes: { type: integer }
        uploaded_at: { type: string, format: date-time }
        availability:
          type: string
          enum: [available]
          description: La feature 006 añadirá `deleted_by_candidate` y `purged_by_retention`.
        latest_parse_job:
          oneOf:
            - { $ref: '#/components/schemas/ParseJob' }
            - { type: 'null' }

    ParseJob:
      type: object
      required: [id, document_id, status, progress_percent, created_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        step:
          type: [string, 'null']
          enum: [extracting_text, classifying, extracting_entries, persisting, null]
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        error_code:
          type: [string, 'null']
          description: Código del catálogo cuando `status` es `failed`.
        error_message:
          type: [string, 'null']
          description: Mensaje accionable en español, resuelto desde el catálogo. Sin PII.
        entries_created: { type: integer }
        truncated:
          type: boolean
          description: El texto del documento superó el límite de extracción y se truncó (research R-14).
        is_retryable:
          type: boolean
          description: Verdadero solo si `status` es `failed` (FR-023).
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    ProfileState:
      type: string
      enum: [draft, complete]

    OnboardingStep:
      type: string
      description: |
        Paso derivado del estado, no persistido (research R-18). `setup`
        significa que la primera ejecución no ha concluido: el onboarding del CV
        está bloqueado hasta que haya acuse de divulgación y proveedor de
        generación utilizable (FR-002, FR-010).
      enum: [setup, upload, processing, processing_failed, objectives, confirm, done]

    Objectives:
      type: object
      required: [locations, industries, deal_breakers]
      properties:
        target_role: { type: [string, 'null'] }
        salary_min: { type: [number, 'null'] }
        salary_max: { type: [number, 'null'] }
        salary_currency: { type: [string, 'null'], enum: [MXN, USD, null] }
        remote_preference: { type: [string, 'null'], enum: [onsite, hybrid, remote, any, null] }
        locations: { type: array, items: { type: string } }
        industries: { type: array, items: { type: string } }
        deal_breakers: { type: array, items: { type: string } }

    ObjectivesPatch:
      type: object
      description: Actualización parcial; solo se modifican los campos presentes.
      properties:
        target_role: { type: [string, 'null'] }
        salary_min: { type: [number, 'null'] }
        salary_max: { type: [number, 'null'] }
        salary_currency: { type: [string, 'null'], enum: [MXN, USD, null] }
        remote_preference: { type: [string, 'null'], enum: [onsite, hybrid, remote, any, null] }
        locations: { type: array, items: { type: string } }
        industries: { type: array, items: { type: string } }
        deal_breakers: { type: array, items: { type: string } }

    ConfirmationBlocker:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [NO_ENTRIES, MISSING_TARGET_ROLE, MISSING_LOCATION_OR_REMOTE, MISSING_SALARY_EXPECTATION]
        message: { type: string, description: Explicación en español de qué falta (FR-039). }

    Profile:
      type: object
      required:
        [id, state, objectives, onboarding_step, entry_counts,
         has_unconfirmed_changes, confirmation_blockers]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/ProfileState' }
        objectives: { $ref: '#/components/schemas/Objectives' }
        onboarding_step: { $ref: '#/components/schemas/OnboardingStep' }
        entry_counts:
          type: object
          description: Conteo de entradas vivas por tipo, para la navegación de la revisión.
          additionalProperties: { type: integer }
        incomplete_entry_count:
          type: integer
          description: Entradas marcadas como incompletas (US2 AC4).
        current_version:
          oneOf:
            - { $ref: '#/components/schemas/ProfileVersionSummary' }
            - { type: 'null' }
        last_confirmed_at: { type: [string, 'null'], format: date-time }
        has_unconfirmed_changes:
          type: boolean
          description: Derivado del hash de contenido, no persistido (FR-044, research R-08).
        confirmation_blockers:
          type: array
          description: Vacío ⇔ el perfil puede confirmarse (FR-039).
          items: { $ref: '#/components/schemas/ConfirmationBlocker' }

    EntryType:
      type: string
      enum: [experience, achievement, education, skill, certification, language, project]

    EntryOrigin:
      type: string
      enum: [cv_seed, user_added, user_edited]

    ProfileEntry:
      type: object
      required: [id, entry_type, origin, content, is_complete, missing_fields, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador estable; no cambia por ediciones posteriores (FR-025).
        entry_type: { $ref: '#/components/schemas/EntryType' }
        origin: { $ref: '#/components/schemas/EntryOrigin' }
        content: { $ref: '#/components/schemas/EntryContent' }
        content_language:
          type: [string, 'null']
          description: ISO 639-1 del contenido; nunca se traduce (FR-027).
        is_complete:
          type: boolean
          description: Calculado por reglas deterministas, no por el modelo (FR-028).
        missing_fields:
          type: array
          items: { type: string }
          description: Campos clave ausentes cuando `is_complete` es falso.
        source_document_id: { type: [string, 'null'], format: uuid }
        source_excerpt:
          type: [string, 'null']
          description: Fragmento literal del CV del que se extrajo la entrada.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EntryCreate:
      type: object
      required: [entry_type, content]
      properties:
        entry_type: { $ref: '#/components/schemas/EntryType' }
        content: { $ref: '#/components/schemas/EntryContent' }
        content_language: { type: [string, 'null'] }

    EntryPatch:
      type: object
      required: [content]
      properties:
        content: { $ref: '#/components/schemas/EntryContent' }
        content_language: { type: [string, 'null'] }

    # Unión discriminada: FastAPI la genera desde el Union[...] de Pydantic v2 y
    # openapi-typescript la traduce a una unión discriminada de TypeScript, con
    # lo que el estrechamiento de tipo en el front lo hace el compilador (art. I).
    EntryContent:
      oneOf:
        - { $ref: '#/components/schemas/ExperienceContent' }
        - { $ref: '#/components/schemas/AchievementContent' }
        - { $ref: '#/components/schemas/EducationContent' }
        - { $ref: '#/components/schemas/SkillContent' }
        - { $ref: '#/components/schemas/CertificationContent' }
        - { $ref: '#/components/schemas/LanguageContent' }
        - { $ref: '#/components/schemas/ProjectContent' }
      discriminator:
        propertyName: kind
        mapping:
          experience: '#/components/schemas/ExperienceContent'
          achievement: '#/components/schemas/AchievementContent'
          education: '#/components/schemas/EducationContent'
          skill: '#/components/schemas/SkillContent'
          certification: '#/components/schemas/CertificationContent'
          language: '#/components/schemas/LanguageContent'
          project: '#/components/schemas/ProjectContent'

    # Fechas parciales: los CVs rara vez traen día. Forzar uno sería inventar
    # precisión que el documento no tiene (art. IV).
    PartialDate:
      type: [string, 'null']
      pattern: '^\d{4}(-\d{2})?$'
      examples: ["2023-05", "2019"]

    ExperienceContent:
      type: object
      required: [kind]
      properties:
        kind: { type: string, const: experience }
        title: { type: [string, 'null'] }
        organization: { type: [string, 'null'] }
        start_date: { $ref: '#/components/schemas/PartialDate' }
        end_date: { $ref: '#/components/schemas/PartialDate' }
        is_current: { type: [boolean, 'null'] }
        location: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        highlights: { type: array, items: { type: string } }

    AchievementContent:
      type: object
      required: [kind]
      properties:
        kind: { type: string, const: achievement }
        description: { type: [string, 'null'] }
        metric: { type: [string, 'null'] }
        context: { type: [string, 'null'] }
        related_organization: { type: [string, 'null'] }
        occurred_at: { $ref: '#/components/schemas/PartialDate' }

    EducationContent:
      type: object
      required: [kind]
      properties:
        kind: { type: string, const: education }
        institution: { type: [string, 'null'] }
        degree: { type: [string, 'null'] }
        field_of_study: { type: [string, 'null'] }
        start_date: { $ref: '#/components/schemas/PartialDate' }
        end_date: { $ref: '#/components/schemas/PartialDate' }
        status: { type: [string, 'null'], enum: [completed, in_progress, incomplete, null] }

    SkillContent:
      type: object
      required: [kind]
      properties:
        kind: { type: string, const: skill }
        name: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        level: { type: [string, 'null'] }
        years_of_experience: { type: [number, 'null'] }

    CertificationContent:
      type: object
      required: [kind]
      properties:
        kind: { type: string, const: certification }
        name: { type: [string, 'null'] }
        issuer: { type: [string, 'null'] }
        issued_at: { $ref: '#/components/schemas/PartialDate' }
        expires_at: { $ref: '#/components/schemas/PartialDate' }
        credential_id: { type: [string, 'null'] }

    LanguageContent:
      type: object
      required: [kind]
      properties:
        kind: { type: string, const: language }
        name: { type: [string, 'null'] }
        level: { type: [string, 'null'], enum: [basic, intermediate, advanced, native, null] }
        certification: { type: [string, 'null'] }

    ProjectContent:
      type: object
      required: [kind]
      properties:
        kind: { type: string, const: project }
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        role: { type: [string, 'null'] }
        technologies: { type: array, items: { type: string } }
        url: { type: [string, 'null'], format: uri }
        start_date: { $ref: '#/components/schemas/PartialDate' }
        end_date: { $ref: '#/components/schemas/PartialDate' }

    ProfileVersionSummary:
      type: object
      required: [id, version_number, origin, created_at, entry_count]
      properties:
        id: { type: string, format: uuid }
        version_number: { type: integer }
        origin:
          type: string
          enum: [confirmation]
          description: La feature 007 añadirá `cv_merge`.
        created_at: { type: string, format: date-time }
        entry_count: { type: integer }
        is_current: { type: boolean }

    ProfileVersion:
      allOf:
        - { $ref: '#/components/schemas/ProfileVersionSummary' }
        - type: object
          required: [content]
          properties:
            content:
              type: object
              required: [objectives, entries]
              description: |
                Contenido íntegro e inmutable en el momento de la confirmación
                (FR-040, FR-041). Las entradas van embebidas completas, no por
                referencia: la versión debe leerse aunque la entrada se borre
                después.
              properties:
                objectives: { $ref: '#/components/schemas/Objectives' }
                entries:
                  type: array
                  items: { $ref: '#/components/schemas/ProfileEntry' }

    PendingChanges:
      type: object
      required: [has_changes, added, modified, removed, objectives_changed]
      description: Diff determinista entre el trabajo en curso y la versión vigente (FR-044).
      properties:
        has_changes: { type: boolean }
        added:
          type: array
          items: { $ref: '#/components/schemas/ProfileEntry' }
        modified:
          type: array
          items:
            type: object
            required: [entry, changed_fields]
            properties:
              entry: { $ref: '#/components/schemas/ProfileEntry' }
              changed_fields: { type: array, items: { type: string } }
        removed:
          type: array
          description: Entradas presentes en la versión vigente y ya no en el trabajo en curso.
          items: { $ref: '#/components/schemas/ProfileEntry' }
        objectives_changed:
          type: array
          items: { type: string }
