[project]
name = "vokara-backend"
version = "0.1.0"
description = "Vokara backend — local-first job search agent"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
    # API and validation
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database: a single Postgres 16 + pgvector (art. VII)
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.2",
    "pgvector>=0.3.5",
    # Async parsing pipeline: Celery worker, Redis as broker only (research R-28)
    "celery>=5.4.0",
    "redis>=5.1.0",
    # Text extraction from the master CV (research R-01, R-02)
    "pypdf>=5.0.1",
    "python-docx>=1.1.2",
    # LLM port: structured output with Pydantic schemas (ADR-003, ADR-011)
    "langchain-core>=0.3.9",
    "langchain-google-genai>=2.0.1",
    # Structured logs with redaction (art. VIII, research R-13)
    "structlog>=24.4.0",
]

# Explicitly out (plan.md "Explícitamente fuera"): PyJWT and argon2 (no auth,
# ADR-008), boto3/MinIO (no object storage, ADR-007), Sentry (disabled by
# default, art. VIII v2.1.0).

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    # Integration tests run against real Postgres and Redis (art. VI)
    "testcontainers[postgres,redis]>=4.8.2",
    # Starlette's TestClient transport
    "httpx>=0.27.2",
    # The ADR-008 binding tests and the env-file contract test read the
    # Compose files as data (T014, T015)
    "pyyaml>=6.0.2",
    "types-PyYAML>=6.0.12",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
