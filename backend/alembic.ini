[alembic]
script_location = app/db/migrations
prepend_sys_path = .
# Filename mirrors the revision: 0001_candidate_onboarding.py
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

# No sqlalchemy.url here on purpose: the URL comes from Settings, which reads
# the environment first (research R-21). A literal here would be a second place
# to configure the same thing.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
